name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Analytics snippet is injected at deploy time so the repository itself
      # stays tracking-free (forks and self-deploys of site/ get no analytics).
      # See PRIVACY.md ("About this website").
      - name: Inject analytics snippet (official deployment only)
        if: github.repository == 'wheresfrank/openfamily'
        run: |
          find site -name '*.html' -print0 | xargs -0 sed -i 's#</head>#  <script defer data-domain="openfamily.app" src="https://stats.subwiz.ai/js/pa-L7jWcNReMehlGYzagVUpb.js"></script>\n</head>#'
          grep -q 'stats.subwiz.ai/js/pa-' site/index.html
          grep -q 'stats.subwiz.ai/js/pa-' site/compare/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
