name: Build Web Preview

# Builds the Flutter app for the web engine (used for the browser-based
# device preview / emulator substitute). Manual dispatch; upload as an
# artifact so the host does not need a local Flutter SDK.

on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Add the web platform (generated on demand; not committed)
        run: flutter create --platforms=web --project-name openfamily .
      - name: Dependencies
        run: flutter pub get
      - name: Build web (under /app/ for the device-frame preview server)
        run: flutter build web --release --base-href /app/
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web
          retention-days: 7