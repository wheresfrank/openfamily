name: Build Android APK

# Builds the release APK on merges that touch the Flutter app (and on manual
# dispatch) and publishes it as a GitHub Release. The admin panel's Download
# button fetches the latest release asset and caches it in APK_DIR. The APK is
# not committed to the repository.

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Stage APK
        run: |
          set -euo pipefail
          APK=$(find app/build/app/outputs -name 'app-release.apk' -print -quit)
          test -n "$APK" || { echo "APK not found after build" >&2; exit 1; }
          cp "$APK" whereabouts-release.apk
          echo "Staged $APK -> whereabouts-release.apk"
          ls -lh whereabouts-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK ${{ github.run_number }}
          files: whereabouts-release.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          body: |
            Release APK built from ${{ github.sha }}.
            The admin APK page fetches this asset automatically.
