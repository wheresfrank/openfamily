name: Build Android APK

# Builds the release APK and attaches it to a GitHub release. The server does
# NOT build APKs itself (that would require a multi-GB Flutter/Android toolchain
# in the server image); instead this workflow builds the APK in CI and the admin
# panel's "Download" button serves whatever is placed in the server's APK_DIR.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Stage APK
        run: |
          set -euo pipefail
          APK=$(find app/build/app/outputs -name 'app-release.apk' -print -quit)
          test -n "$APK" || { echo "APK not found after build" >&2; exit 1; }
          cp "$APK" whereabouts-release.apk
          echo "Staged $APK -> whereabouts-release.apk"

      - name: Attach APK to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: whereabouts-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact (manual builds)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: whereabouts-release-apk
          path: whereabouts-release.apk
