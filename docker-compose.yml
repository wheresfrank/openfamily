services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Local dev: ":80" (HTTP only). Production: your domain, e.g.
      # "openfamily.example.com" (Caddy provisions Let's Encrypt automatically).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Optional: public address for ntfy (UnifiedPush). Leave empty locally.
      # Production: PUSH_ADDRESS=push.example.com and CADDYFILE=Caddyfile.with-push.
      PUSH_ADDRESS: ${PUSH_ADDRESS:-}
    volumes:
      - ./caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      # Dev default uses sslmode=disable. In production (APP_ENV=production),
      # set DATABASE_URL in .env with sslmode=require or sslmode=verify-full.
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:-openfamily}:${POSTGRES_PASSWORD:-openfamily}@postgres:5432/${POSTGRES_DB:-openfamily}?sslmode=disable}"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "720h"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      APP_ENV: ${APP_ENV:-development}
      # Caddy terminates TLS in front of the API.
      TLS_BEHIND_PROXY: ${TLS_BEHIND_PROXY:-true}
      VERBOSE_PUSH: ${VERBOSE_PUSH:-false}
      # Advertised to the app via GET /config so a generic APK can register
      # UnifiedPush without a dart-define.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:2586}
      # Raster tile templates on GET /config. Empty uses OSM street + Esri satellite.
      TILE_URL: ${TILE_URL:-}
      SATELLITE_TILE_URL: ${SATELLITE_TILE_URL:-}
      # APNs (iOS push). Empty disables APNs; Android still works via ntfy.
      # To enable iOS push, add a volume mount to this service:
      #   volumes:
      #     - ./apns/AuthKey.p8:/apns/AuthKey.p8:ro
      # and set APNS_KEY_FILE=/apns/AuthKey.p8 in .env.
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      # Optional Twilio SMS for family alerts. Empty disables SMS; in-app
      # push and WebSocket still work. Admin Settings can override these.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Directory the admin panel caches the GitHub Release APK into. The APK
      # is built in CI and published as a release asset; the server fetches it
      # on download (it does not build APKs).
      APK_DIR: ${APK_DIR:-/data/apk}
      APK_GITHUB_REPO: ${APK_GITHUB_REPO:-wheresfrank/openfamily}
      APK_GITHUB_TOKEN: ${APK_GITHUB_TOKEN:-}
      # In-admin "Update server" button: the API proxies to the updater sidecar
      # below (same shared token). Leave UPDATER_TOKEN empty to disable server
      # self-update entirely.
      UPDATER_URL: http://updater:8081
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      # File where the updater records the deployed git ref; read at runtime so
      # the admin panel can show which commit is running.
      DEPLOY_REF_FILE: /data/deploy/deployed-ref
    volumes:
      - ./apk:/data/apk
      - deploy_meta:/data/deploy
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1$${HTTP_ADDR}/healthz\" >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6

  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openfamily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfamily}
      POSTGRES_DB: ${POSTGRES_DB:-openfamily}
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    environment:
      # Public base URL the app uses to reach ntfy. Production must be https://
      # on PUSH_ADDRESS (see caddy/Caddyfile.with-push). Local default is
      # loopback-only so the topic server is not on the public internet.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://127.0.0.1:2586}
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_etc:/etc/ntfy
    expose:
      - "80"
    ports:
      - "127.0.0.1:2586:80"

  # Sidecar that powers the in-admin "Update server" button. It mounts the
  # compose project (the git clone) and the host Docker socket so it can run
  # "git pull" + "docker compose up -d --build" on behalf of the API, which
  # cannot update itself from inside its own container.
  #
  # SECURITY: mounting docker.sock grants root-equivalent access to the host.
  # This service is internal-only (no published ports) and every endpoint
  # requires X-Updater-Token to match UPDATER_TOKEN. Set a long random token
  # (openssl rand -hex 32), or leave UPDATER_TOKEN empty to disable updates.
  updater:
    build: ./updater
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      REPO_DIR: /repo
      DATA_DIR: /data
      # Shared with the api service so it can read the deployed git ref.
      DEPLOY_REF_FILE: /data/deploy/deployed-ref
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - updater_data:/data
      - deploy_meta:/data/deploy
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  ntfy_cache:
  ntfy_etc:
  deploy_meta:
  updater_data:
